[project]
name = "jax-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "aiofiles>=25.0",
    "cupy-cuda12x>=14.0.1",
    "h5py>=3.16.0",
    "humanize>=4.0",
    "ipython>=8.38.0",
    "ipywidgets>=8.1.8",
    "jax[cuda12]>=0.6.2",
    "jmp>=0.0.4",
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "numpy>=2.2.6",
    "orbax>=0.1.9",
    "path>=17.1.1",
    "phantomgaze",
    "psutil>=5.0",
    "pyvista[jupyter]>=0.47.1",
    "scikit-image>=0.25.2",
    "simplejson>=3.0",
    "termcolor>=3.3.0",
    "trame>=3.12.0",
    "trame-vtk>=2.10.2",
    "trame-vuetify>=3.2.1",
    "trimesh>=4.11.3",
    "uvloop>=0.22",
]

[tool.uv]
override-dependencies = [
    "nvidia-cublas-cu12>=12.9,<13",
    "nvidia-cudnn-cu12>=9.0,<10",
    "nvidia-nvshmem-cu12>=3.0,<4",
    "orbax-checkpoint>=0.5,<1",
]

[tool.uv.sources]
phantomgaze = { git = "https://github.com/loliverhennigh/PhantomGaze" }
